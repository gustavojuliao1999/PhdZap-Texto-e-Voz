<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · WhatsApp Voice Gateway</title>
<link rel="stylesheet" href="/static/ui.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .card { width: 100%; max-width: 380px; padding: 28px; }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .logo span { width: 34px; height: 34px; border-radius: 9px; background: var(--green-dark); display: grid; place-items: center; font-size: 18px; }
  h1 { font-size: 19px; }
  p { margin: 4px 0 18px; font-size: 14px; }
  button { width: 100%; margin-top: 16px; padding: 12px; }
  #err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 10px; }
</style>
</head>
<body>
  <form class="card" id="form" autocomplete="off">
    <div class="logo"><span>📞</span><h1>WhatsApp Voice Gateway</h1></div>
    <p class="muted">Informe a chave de acesso do sistema.</p>
    <label for="key">Chave de acesso</label>
    <input id="key" type="password" placeholder="wva_…" required autofocus>
    <button class="green" id="btn" type="submit">Entrar</button>
    <div id="err" role="alert"></div>
  </form>
<script>
  const form = document.getElementById("form"), btn = document.getElementById("btn"), err = document.getElementById("err");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true; err.textContent = "";
    try {
      const res = await fetch("/admin/api/session", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ key: document.getElementById("key").value }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error ?? `Erro ${res.status}`);
      location.href = "/admin";
    } catch (ex) {
      err.textContent = ex.message;
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
