<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receptor de ligações</title>
<link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/ui.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; background: var(--panel); }
  .top { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .top .name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 18px; text-align: center; }
  .avatar {
    width: 76px; height: 76px; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center;
    font-size: 32px; border: 2px solid var(--line);
  }
  .ringing .avatar { border-color: var(--amber); animation: ring 1.2s infinite; }
  .incall .avatar { border-color: var(--green); }
  .who { font-size: 20px; font-weight: 600; word-break: break-word; }
  .sub { color: var(--muted); font-size: 13.5px; }
  .timer { font-variant-numeric: tabular-nums; font-size: 15px; }
  .actions { display: flex; gap: 10px; width: 100%; max-width: 320px; }
  .actions button { flex: 1; padding: 12px; font-size: 15px; }
  .meters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 320px; font-size: 12px; color: var(--muted); }
  .tag-video { color: var(--blue); font-size: 13px; font-weight: 600; }
  .soundbar { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px; font-size: 12.5px; background: rgba(245,165,36,.12); color: var(--amber); }
  .soundbar button { padding: 4px 10px; font-size: 12px; }
</style>
</head>
<body>
  <div class="top">
    <span class="name" id="lineName">…</span>
    <span class="badge connecting" id="lineStatus">conectando…</span>
  </div>
  <div class="soundbar" id="soundbar">🔔 Clique em qualquer lugar para ativar o toque <button id="soundBtn">Ativar</button></div>
  <div class="stage" id="stage"></div>
  <div class="toast" id="toast"></div>

<script type="module">
import {
  api, connectEvents, notifyParent, ringtone, autoUnlockSound, CallAudio, clientId, agentName, fmtPhone, fmtDuration, esc,
} from "/static/voice.js";
import { CallVideo, VIDEO_CSS } from "/static/video-call.js";

const $ = (id) => document.getElementById(id);
const toast = (msg) => {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.style.display = "none"), 4000);
};

let line = null;        // {id, name, status, phone, current}
let call = null;        // chamada atual da linha
let ignored = new Set();
let busy = false;       // ação em andamento (evita clique duplo)
let endedInfo = null;   // mensagem breve após o fim

const levels = { mic: 0, remote: 0 };
const audio = new CallAudio((kind, v) => {
  levels[kind] = v;
  const el = $(kind === "mic" ? "micLevel" : "remoteLevel");
  if (el) el.style.width = `${v * 100}%`;
}, () => render());

// Só ligações recebidas: no mesmo navegador o discador cuida das de saída.
const mine = () => call && call.direction === "incoming" && call.ownerClientId === clientId;
const isIncomingRinging = () => call && call.direction === "incoming" && call.status === "ringing" && !call.ownerClientId;

const STATUS = { connecting: "conectando…", qr: "sem telefone", open: "online", error: "erro", stopped: "parada" };

const render = () => {
  $("lineName").textContent = line?.name ?? "…";
  const st = line?.status ?? "connecting";
  $("lineStatus").textContent = STATUS[st] ?? st;
  $("lineStatus").className = "badge " + st;
  $("soundbar").hidden = ringtone.unlocked;

  const shouldRing = isIncomingRinging() && !ignored.has(call.id);
  shouldRing ? ringtone.start() : ringtone.stop();
  document.title = shouldRing ? `📞 ${call.pushName ?? fmtPhone(call.remote)} ligando…` : "Receptor de ligações";

  const stage = $("stage");
  stage.className = "stage";
  const who = (c) => `<div class="who">${esc(c.pushName ?? fmtPhone(c.remote))}</div>
    ${c.pushName ? `<div class="sub">${esc(fmtPhone(c.remote))}</div>` : ""}`;

  if (!line || st !== "open") {
    stage.innerHTML = `<div class="avatar">📵</div><div class="sub">${st === "qr" ? "Nenhum telefone conectado a esta linha." : "Conectando à linha…"}</div>`;
    return;
  }
  if (!(call && mine()) && video.callId) video.stop();
  if (call && mine()) {
    stage.classList.add(call.status === "connected" ? "incall" : "ringing");
    stage.innerHTML = `<div class="avatar">👤</div>${who(call)}
      ${call.isVideo && !call.videoStream ? `<div class="tag-video">📹 Chamada de vídeo atendida só com áudio · ligue a câmera ou a tela abaixo</div>` : ""}
      <div class="timer" id="timer">${call.status === "connected" ? fmtDuration(call.connectedAt) : "conectando…"}</div>
      <div class="meters">
        <div>Você<div class="meter"><div id="micLevel" style="width:${levels.mic * 100}%"></div></div></div>
        <div>Cliente<div class="meter"><div id="remoteLevel" style="width:${levels.remote * 100}%"></div></div></div>
      </div>
      <div class="actions">
        <button id="muteBtn">${audio.muted ? "🎙 Desmutar" : "🔇 Mutar"}</button>
        <button class="red" id="hangupBtn">Desligar</button>
      </div>`;
    $("muteBtn").onclick = () => { audio.setMuted(!audio.muted); api("POST", `/calls/${call.id}/mute`, { muted: audio.muted }).catch(() => {}); render(); };
    $("hangupBtn").onclick = act(async () => { await api("POST", `/calls/${call.id}/hangup`); });
    // Vídeo: o do cliente, a sua prévia e os botões Câmera / Tela / Sem vídeo.
    if (call.status === "connected") {
      video.sync(call);
      stage.querySelector(".meters").before(video.el);
      if (call.videoStream || video.source !== "off") stage.querySelector(".avatar").remove();
    }
    return;
  }
  if (isIncomingRinging()) {
    stage.classList.add("ringing");
    const isIgnored = ignored.has(call.id);
    stage.innerHTML = `<div class="avatar">📞</div>${who(call)}
      <div class="sub">${isIgnored ? "Você ignorou esta ligação" : call.isVideo ? "📹 Chamada de vídeo recebida" : "Ligação recebida"}</div>
      <div class="actions">
        <button class="green" id="answerBtn">Atender</button>
        ${isIgnored ? "" : `<button class="ghost" id="ignoreBtn">Ignorar</button>`}
      </div>`;
    $("answerBtn").onclick = act(answer);
    if (!isIgnored) $("ignoreBtn").onclick = () => { ignored.add(call.id); render(); };
    return;
  }
  if (call) {
    // Ligação com outra pessoa (atendida por outro atendente ou de saída).
    const by = call.ownerAgent ? `com ${esc(call.ownerAgent)}` : "";
    const what = call.direction === "incoming" ? `Atendida ${by || "por outra pessoa"}`
      : call.ownerClientId === clientId ? "Você está numa ligação de saída (discador)" : `Linha em uso ${by}`;
    stage.innerHTML = `<div class="avatar">🔒</div>${who(call)}<div class="sub">${what}</div>`;
    return;
  }
  stage.innerHTML = `<div class="avatar">☎️</div>
    <div class="sub">${endedInfo ?? "Aguardando ligações…"}</div>
    ${agentName ? `<div class="sub">Atendente: ${esc(agentName)}</div>` : ""}`;
};

document.head.insertAdjacentHTML("beforeend", `<style>${VIDEO_CSS}</style>`);
const video = new CallVideo({ onError: (err) => toast(err.message) });

const act = (fn) => async () => {
  if (busy) return;
  busy = true;
  try { await fn(); } catch (err) { toast(err.message); } finally { busy = false; render(); }
};

const answer = async () => {
  ringtone.stop();
  const id = call.id;
  await audio.prepare();                // pede o microfone ANTES de pegar a ligação
  try {
    call = await api("POST", `/calls/${id}/accept`, { clientId, agent: agentName || undefined });
  } catch (err) {
    audio.stop();
    throw err.status === 409 ? new Error(err.message || "Outra pessoa já atendeu") : err;
  }
  notifyParent("answered", call);
  render();
  await audio.start(id);
};

setInterval(() => { const t = $("timer"); if (t && call?.status === "connected") t.textContent = fmtDuration(call.connectedAt); }, 1000);

// Desbloqueio de som (política de autoplay dos navegadores): libera no primeiro clique/tecla,
// aqui ou na página de fora (iframe com allow="autoplay").
autoUnlockSound(() => render());
$("soundBtn").onclick = () => ringtone.unlock();

connectEvents((e) => {
  switch (e.type) {
    case "hello":
      line = e.line; call = e.line.current; break;
    case "line":
      line = { ...line, ...e.line }; call = e.line.current; break;
    case "incoming":
      call = e.call; endedInfo = null;
      notifyParent("incoming", e.call); break;
    case "dialing":
      call = e.call; break;
    case "answered":
      call = e.call;
      if (e.call.ownerClientId !== clientId && e.call.direction === "incoming") notifyParent("answered-elsewhere", e.call);
      break;
    case "connected":
      call = e.call;
      if (call.ownerClientId === clientId) notifyParent("connected", e.call);
      break;
    case "ended": {
      const wasMine = e.call.ownerClientId === clientId && e.call.direction === "incoming";
      if (call?.id === e.call.id) call = null;
      if (wasMine) {
        audio.stop();
        notifyParent("ended", e.call);
        endedInfo = `Ligação encerrada (${fmtDuration(e.call.connectedAt, e.call.endedAt)})`;
      } else if (e.call.direction === "incoming" && !e.call.connectedAt) {
        endedInfo = `Ligação perdida de ${e.call.pushName ?? fmtPhone(e.call.remote)}`;
      }
      setTimeout(() => { endedInfo = null; render(); }, 8000);
      break;
    }
  }
  render();
}, (ok, reason) => {
  if (!ok && reason) { line = null; toast(`Desconectado: ${reason}`); }
  if (!ok) { $("lineStatus").textContent = "reconectando…"; $("lineStatus").className = "badge error"; }
});

render();
</script>
</body>
</html>
