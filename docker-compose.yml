# WhatsApp Voice Gateway + PostgreSQL
#
#   cp .env.example .env    # defina ADMIN_API_KEY e POSTGRES_PASSWORD
#   docker compose up -d --build
#
# O código do baileys-caller vem da pasta ao lado (../baileys-caller).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-gateway}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Exposto só em localhost (para rodar o app fora do Docker ou usar o Prisma Studio).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  app:
    build:
      context: .
      additional_contexts:
        baileys-caller: ../baileys-caller
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gateway}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gateway}?schema=public
      ADMIN_API_KEY: ${ADMIN_API_KEY:?defina ADMIN_API_KEY no .env}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      VOIP_DEBUG: ${VOIP_DEBUG:-}
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
    volumes:
      # Sessões do WhatsApp de cada telefone (não perca este volume!)
      - appdata:/data
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
  appdata:
