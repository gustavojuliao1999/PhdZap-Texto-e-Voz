# PhdZap + PostgreSQL
#
#   cp .env.example .env    # defina ADMIN_API_KEY e POSTGRES_PASSWORD
#   docker compose up -d --build
#
# O código do baileys-caller vem da pasta ao lado (../baileys-caller).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-gateway}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Exposto só em localhost (para rodar o app fora do Docker ou usar o Prisma Studio).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  app:
    build:
      context: .
      additional_contexts:
        baileys-caller: ../baileys-caller
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gateway}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gateway}?schema=public
      ADMIN_API_KEY: ${ADMIN_API_KEY:?defina ADMIN_API_KEY no .env}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      VOIP_DEBUG: ${VOIP_DEBUG:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      MEDIA_CACHE_DAYS: ${MEDIA_CACHE_DAYS:-30}
      MEDIA_CACHE_MAX_MB: ${MEDIA_CACHE_MAX_MB:-5120}
      ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS:-false}
      AUDIT_DAYS: ${AUDIT_DAYS:-365}
      RECORDINGS_DAYS: ${RECORDINGS_DAYS:-0}
      TRANSCRIBE: ${TRANSCRIBE:-off}
      TRANSCRIBE_THREADS: ${TRANSCRIBE_THREADS:-}
      TRANSCRIBE_API_URL: ${TRANSCRIBE_API_URL:-}
      TRANSCRIBE_API_KEY: ${TRANSCRIBE_API_KEY:-}
      TRANSCRIBE_MODEL: ${TRANSCRIBE_MODEL:-}
      TRANSCRIBE_LANGUAGE: ${TRANSCRIBE_LANGUAGE:-pt}
      TZ: ${TZ:-America/Sao_Paulo}
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
    volumes:
      # Sessões do WhatsApp de cada telefone (não perca este volume!)
      - appdata:/data
    ports:
      # Atrás de um proxy HTTPS no mesmo servidor, use APP_BIND=127.0.0.1 (só o proxy acessa).
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"

volumes:
  pgdata:
  appdata:
